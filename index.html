<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASTRIV | Open-Source Engine</title>

  <!-- Auto redirect to astriv.co after 3 seconds -->
  <meta http-equiv="refresh" content="3; url=https://astriv.co" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Orbitron', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-6 selection:bg-cyan-500 selection:text-white">

  <!-- Background Glow -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[300px] bg-cyan-500/10 blur-[120px] rounded-full"></div>
  </div>

  <div class="max-w-md w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-8 backdrop-blur-xl shadow-2xl relative text-center space-y-6">
    
    <!-- Header -->
    <div class="space-y-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-cyan-500/30 bg-cyan-500/10 text-cyan-400 text-xs font-medium">
        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
        GitHub Deployment Core
      </div>
      <h1 class="text-3xl font-bold font-mono tracking-wider text-white">ASTRIV</h1>
      <p class="text-xs text-slate-400">Institutional workflow runtime & open-source core</p>
    </div>

    <!-- Redirect Status Box -->
    <div class="bg-slate-950/70 border border-slate-800/80 rounded-xl p-4 text-xs font-mono text-slate-300 space-y-2 text-left">
      <div class="flex items-center justify-between text-slate-500">
        <span>STATUS</span>
        <span class="text-emerald-400 font-semibold">200 OK</span>
      </div>
      <div>Routing to production host:</div>
      <div class="text-cyan-400 truncate">https://astriv.co</div>
      <div class="pt-2 text-[11px] text-slate-500">Redirecting in <span id="countdown" class="text-white font-bold">3</span>s...</div>
    </div>

    <!-- Actions -->
    <div class="flex flex-col gap-2.5">
      <a href="https://astriv.co" class="w-full py-2.5 px-4 rounded-lg bg-gradient-to-r from-blue-600 to-cyan-500 hover:opacity-90 text-white font-semibold text-xs tracking-wide transition shadow-lg shadow-cyan-500/10">
        Open astriv.co Now →
      </a>
      <a href="https://github.com/solohackerzorg/astriv" class="w-full py-2.5 px-4 rounded-lg border border-slate-800 hover:border-slate-700 bg-slate-900 text-slate-300 hover:text-white font-medium text-xs transition">
        View Source on GitHub
      </a>
    </div>

  </div>

  <script>
    let timeLeft = 3;
    const timerElem = document.getElementById('countdown');
    const interval = setInterval(() => {
      timeLeft--;
      if (timerElem) timerElem.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(interval);
        window.location.href = "https://astriv.co";
      }
    }, 1000);
  </script>
</body>
</html>
